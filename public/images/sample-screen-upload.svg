<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Window Header -->
  <rect width="600" height="400" rx="8" fill="#FFFFFF"/>
  <rect width="600" height="42" fill="#F0F2EF"/>
  <circle cx="24" cy="21" r="5" fill="#D9DEDA"/>
  <circle cx="40" cy="21" r="5" fill="#D9DEDA"/>
  <circle cx="56" cy="21" r="5" fill="#D9DEDA"/>
  <rect x="80" y="12" width="300" height="18" rx="4" fill="#FFFFFF"/>
  <text x="92" y="25" font-family="system-ui, sans-serif" font-size="10" fill="#5F6965">https://aaplesarkar.mahaonline.gov.in/portal/revenue/upload</text>
  
  <!-- Content Area -->
  <rect x="32" y="60" width="536" height="24" rx="4" fill="#E6F3F3"/>
  <text x="44" y="76" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0B5F63">Step 3: Upload Mandatory Supporting Documents (कागदपत्रे जोडा)</text>
  
  <!-- Alert Banner -->
  <rect x="32" y="96" width="536" height="32" rx="4" fill="#FDF5E8" stroke="#A96800" stroke-width="1"/>
  <text x="44" y="116" font-family="system-ui, sans-serif" font-size="11" fill="#A96800">Notice: Only PDF or JPG files under 256 KB permitted. Ensure resolution is 75-100 DPI.</text>
  
  <!-- Row 1: Identity Proof -->
  <rect x="32" y="142" width="536" height="54" rx="4" fill="#F7F8F6" stroke="#D9DEDA" stroke-width="1"/>
  <text x="48" y="162" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#17201D">1. Proof of Identity (PoI) *</text>
  <text x="48" y="180" font-family="system-ui, sans-serif" font-size="11" fill="#5F6965">Aadhaar Card / Voter ID / Passport (PDF / JPG)</text>
  <rect x="420" y="154" width="132" height="30" rx="4" fill="#0B5F63"/>
  <text x="456" y="173" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Choose File</text>
  
  <!-- Row 2: Self-Declaration -->
  <rect x="32" y="206" width="536" height="54" rx="4" fill="#F7F8F6" stroke="#D9DEDA" stroke-width="1"/>
  <text x="48" y="226" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#17201D">2. Self-Declaration Form (Affidavit) *</text>
  <text x="48" y="244" font-family="system-ui, sans-serif" font-size="11" fill="#5F6965">Duly signed declaration form in prescribed format</text>
  <rect x="420" y="218" width="132" height="30" rx="4" fill="#0B5F63"/>
  <text x="456" y="237" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Choose File</text>

  <!-- Row 3: Photograph -->
  <rect x="32" y="270" width="536" height="54" rx="4" fill="#F7F8F6" stroke="#D9DEDA" stroke-width="1"/>
  <text x="48" y="290" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#17201D">3. Photograph of Applicant *</text>
  <text x="48" y="308" font-family="system-ui, sans-serif" font-size="11" fill="#5F6965">Dimensions: 160 x 212 px, Size: 20 KB to 50 KB</text>
  <rect x="420" y="282" width="132" height="30" rx="4" fill="#0B5F63"/>
  <text x="456" y="301" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Choose File</text>

  <!-- Bottom Actions -->
  <rect x="448" y="344" width="120" height="36" rx="4" fill="#19734A"/>
  <text x="472" y="366" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Save &amp; Next</text>
  <rect x="32" y="344" width="90" height="36" rx="4" fill="#F0F2EF" stroke="#D9DEDA" stroke-width="1"/>
  <text x="54" y="366" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#5F6965">Previous</text>
  
  <rect width="600" height="400" rx="8" stroke="#D9DEDA" stroke-width="1"/>
</svg>
