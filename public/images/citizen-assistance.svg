<svg width="480" height="320" viewBox="0 0 480 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Clean subtle background -->
  <rect width="480" height="320" rx="12" fill="#F0F2EF"/>
  
  <!-- Warm copper gentle geometric circle -->
  <circle cx="240" cy="160" r="110" fill="#B56A32" fill-opacity="0.08"/>
  <circle cx="240" cy="160" r="80" fill="#0B5F63" fill-opacity="0.06"/>
  
  <!-- Digital Tablet / Phone Device in hand -->
  <rect x="180" y="55" width="120" height="210" rx="14" fill="#FFFFFF" stroke="#0B5F63" stroke-width="2.5"/>
  <rect x="220" y="65" width="40" height="4" rx="2" fill="#D9DEDA"/>
  
  <!-- Screen Elements showing Step-by-Step Task -->
  <rect x="192" y="80" width="96" height="24" rx="4" fill="#0B5F63"/>
  <text x="202" y="96" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#FFFFFF">Step 1: Understand</text>
  
  <rect x="192" y="112" width="96" height="36" rx="4" fill="#F7F8F6" stroke="#D9DEDA" stroke-width="1"/>
  <circle cx="204" cy="126" r="5" fill="#19734A"/>
  <path d="M202 126L203.5 127.5L206 124.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  <text x="214" y="126" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#17201D">Aadhaar Ready</text>
  <text x="214" y="136" font-family="system-ui, sans-serif" font-size="7" fill="#5F6965">Mobile OTP Active</text>
  
  <rect x="192" y="156" width="96" height="36" rx="4" fill="#F7F8F6" stroke="#B56A32" stroke-width="1.2"/>
  <circle cx="204" cy="170" r="5" fill="#B56A32"/>
  <text x="202" y="173" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF">→</text>
  <text x="214" y="170" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#17201D">Next: Scan Bills</text>
  <text x="214" y="180" font-family="system-ui, sans-serif" font-size="7" fill="#5F6965">Recent Electricity Bill</text>
  
  <rect x="192" y="200" width="96" height="30" rx="4" fill="#F0F2EF"/>
  <circle cx="204" cy="214" r="5" fill="#D9DEDA"/>
  <text x="214" y="217" font-family="system-ui, sans-serif" font-size="8" fill="#8A928E">Official Portal</text>
  
  <circle cx="240" cy="248" r="8" fill="#F0F2EF"/>
  <circle cx="240" cy="248" r="4" fill="#8A928E"/>
  
  <!-- Left Side Badge: Multilingual Access -->
  <g transform="translate(48, 110)">
    <rect width="105" height="42" rx="6" fill="#FFFFFF" stroke="#D9DEDA" stroke-width="1"/>
    <circle cx="20" cy="21" r="10" fill="#E6F3F3"/>
    <text x="16" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0B5F63">अ</text>
    <text x="36" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#17201D">मराठी • हिंदी</text>
    <text x="36" y="29" font-family="system-ui, sans-serif" font-size="8" fill="#5F6965">Native regional voice</text>
  </g>
  
  <!-- Right Side Badge: One Step at a Time -->
  <g transform="translate(325, 150)">
    <rect width="112" height="42" rx="6" fill="#FFFFFF" stroke="#D9DEDA" stroke-width="1"/>
    <circle cx="20" cy="21" r="10" fill="#FBF3EC"/>
    <text x="16" y="25" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#B56A32">✓</text>
    <text x="36" y="18" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#17201D">One step at a time</text>
    <text x="36" y="29" font-family="system-ui, sans-serif" font-size="8" fill="#5F6965">Clear, calm guidance</text>
  </g>
